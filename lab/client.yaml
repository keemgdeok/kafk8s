apiVersion: v1
kind: Pod
metadata:
  name: lab-client
  namespace: kafk8s-lab
  labels: {app: kafk8s-lab-client}
spec:
  nodeSelector: {kubernetes.io/hostname: kafk8s-lab-worker4}
  automountServiceAccountToken: false
  containers:
    - name: client
      image: eclipse-temurin:21-jdk@sha256:f9bf7e9fe2f9bc4657537c1a7e20c768f0c3bafca41598263be4714783dd62eb
      command: [sleep, infinity]
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {memory: 384Mi}
