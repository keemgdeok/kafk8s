apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafk8s-reader
  namespace: kafk8s-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kafk8s-reader
  namespace: kafk8s-lab
rules:
  - apiGroups: [kafka.strimzi.io]
    resources: [kafkas, kafkanodepools]
    verbs: [get, list]
  - apiGroups: [core.strimzi.io]
    resources: [strimzipodsets]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kafk8s-reader
  namespace: kafk8s-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kafk8s-reader
subjects:
  - kind: ServiceAccount
    name: kafk8s-reader
    namespace: kafk8s-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: lab-reader
  namespace: kafk8s-lab
  labels: {app: kafk8s-lab-reader}
spec:
  serviceAccountName: kafk8s-reader
  automountServiceAccountToken: true
  nodeSelector: {kubernetes.io/hostname: kafk8s-lab-worker4}
  containers:
    - name: reader
      image: eclipse-temurin:21-jdk@sha256:f9bf7e9fe2f9bc4657537c1a7e20c768f0c3bafca41598263be4714783dd62eb
      command: [sleep, infinity]
      env: [{name: JAVA_OPTS, value: '-XX:ActiveProcessorCount=2 -Xmx192m'}]
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {memory: 512Mi}
