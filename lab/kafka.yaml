apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controllers
  namespace: kafk8s-lab
  labels: {strimzi.io/cluster: demo}
  annotations: {strimzi.io/next-node-ids: '[0-2]'}
spec:
  replicas: 3
  roles: [controller]
  storage:
    type: jbod
    volumes: [{id: 0, type: ephemeral, kraftMetadata: shared}]
  jvmOptions: {'-Xms': 128m, '-Xmx': 128m, '-XX': {ActiveProcessorCount: '2'}}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 384Mi}
  template:
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [kafk8s-lab-worker4]
---
