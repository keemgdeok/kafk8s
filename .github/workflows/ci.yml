name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew --no-daemon test installDist labBundle
      - run: bash -n lab/*.sh
      - run: build/install/kafk8s/bin/kafk8s --help && build/install/kafk8s/bin/kafk8s --version
